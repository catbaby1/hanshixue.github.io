name: Apply homepage and product code corrections

on:
  push:
    paths:
      - '.github/workflows/apply-site-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update site files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re


          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit('Missing expected pattern: ' + label)
              return text.replace(old, new, 1)


          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(
              index,
              '<strong>1–2<em>kW</em></strong>',
              '<strong>1–10<em>kW</em></strong>',
              'homepage power metric'
          )
          old_floats = '''          <div class="hero-float float-a"><small data-i18n="home.float1Label">频率覆盖</small><strong>80 MHz–40 <em>GHz</em></strong></div>
                    <div class="hero-float float-b"><small data-i18n="home.float2Label">产品形态</small><strong>04 <em>FORMS</em></strong></div>'''
          new_floats = '''          <div class="hero-data-strip">
                      <div class="hero-float float-a"><small data-i18n="home.float1Label">频率覆盖</small><strong>80 MHz–40 <em>GHz</em></strong></div>
                      <div class="hero-float float-b"><small data-i18n="home.float2Label">产品形态</small><strong>04 <em>FORMS</em></strong></div>
                    </div>'''
          index = replace_once(index, old_floats, new_floats, 'hero data cards')
          index_path.write_text(index, encoding='utf-8')

          for name in ['index.html', 'products.html', 'about.html', 'contact.html', 'app.js']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\bCAB\b', 'JG', text)
              if name.endswith('.html'):
                  text = text.replace('site.css?v=10', 'site.css?v=11')
              if re.search(r'\bCAB\b', text):
                  raise SystemExit('CAB remains in ' + name)
              path.write_text(text, encoding='utf-8')

          css_path = Path('site.css')
          css = css_path.read_text(encoding='utf-8')
          css = replace_once(
              css,
              '.hero-visual { position: relative; min-height: 570px; display: flex; align-items: center; justify-content: center; perspective: 1100px; }',
              '.hero-visual { position: relative; min-height: 570px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; perspective: 1100px; }',
              'hero visual layout'
          )
          css = replace_once(
              css,
              '''.hero-float {
            position: absolute;
            z-index: 4;
            min-width: 155px;
            padding: 13px 15px;''',
              '''.hero-data-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; position: relative; z-index: 4; }
          .hero-float {
            position: relative;
            z-index: 4;
            width: 100%;
            min-width: 0;
            padding: 12px 14px;''',
              'hero float block'
          )
          css = replace_once(
              css,
              '.hero-float.float-a { left: -26px; bottom: 52px; }\n.hero-float.float-b { right: -28px; top: 82px; }',
              '.hero-float.float-a, .hero-float.float-b { left: auto; right: auto; top: auto; bottom: auto; }',
              'desktop float positioning'
          )
          css = replace_once(
              css,
              '  .hero-float.float-a { left: -8px; }\n  .hero-float.float-b { right: -8px; }\n',
              '',
              'tablet float positioning'
          )
          css = replace_once(
              css,
              '''  .hero-float { min-width: 130px; padding: 11px 12px; }
            .hero-float strong { font-size: 19px; }
            .hero-float.float-a { left: 4px; bottom: 20px; }
            .hero-float.float-b { right: 3px; top: 38px; }''',
              '''  .hero-data-strip { gap: 8px; }
            .hero-float { min-width: 0; padding: 10px 11px; }
            .hero-float strong { font-size: 18px; }''',
              'mobile float positioning'
          )
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html products.html about.html contact.html app.js site.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix power range, hero cards and JG product code"
            git push origin HEAD:main
          fi
