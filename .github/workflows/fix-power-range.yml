name: Fix homepage power range

on:
  push:
    paths:
      - '.github/workflows/fix-power-range.yml'

permissions:
  contents: write

jobs:
  fix-power-range:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update power range
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<strong>1–10<em>kW</em></strong>'
          new = '<strong>1–10000<em>W</em></strong>'
          if old not in text:
              raise SystemExit('Expected power range markup not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Change homepage power range to watts"
            git push origin HEAD:main
          fi
