name: Fix contact email and deploy

on:
  push:
    paths:
      - '.github/workflows/fix-email.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update contact email
        shell: bash
        run: |
          sed -i 's/lwdwdmdc@gmail\.com/lwhwdmdc@gmail\.com/g' index.html products.html about.html contact.html app.js
          sed -i 's/app\.js?v=11/app.js?v=12/g' index.html products.html about.html contact.html
          if grep -R "lwdwdmdc@gmail.com" index.html products.html about.html contact.html app.js; then
            echo "Old email still exists"
            exit 1
          fi

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html products.html about.html contact.html app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix contact email"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
