name: Remove company address

on:
  push:
    paths:
      - '.github/workflows/remove-address.yml'

permissions:
  contents: write

jobs:
  remove-address:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove address content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          contact_path = Path('contact.html')
          contact = contact_path.read_text(encoding='utf-8')
          contact, count = re.subn(
              r'\r?\n\s*<div class="contact-card contact-address-card">[\s\S]*?</div>',
              '',
              contact,
              count=1
          )
          if count != 1:
              raise SystemExit('Address card not found')
          contact_path.write_text(contact, encoding='utf-8')

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = re.sub(r"\r?\n    'contact\.addressLabel':[^\r\n]*", '', app)
          app = re.sub(r"\r?\n    'contact\.address':[^\r\n]*", '', app)
          app = re.sub(r"\r?\n    'contact\.addressSub':[^\r\n]*", '', app)
          app_path.write_text(app, encoding='utf-8')

          css_path = Path('site.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(r'\r?\n\.contact-address-card strong \{[^\r\n]*\}', '', css)
          css = re.sub(r'\r?\n  \.contact-address-card strong \{[^\r\n]*\}', '', css)
          css_path.write_text(css, encoding='utf-8')

          if 'contact-address-card' in contact_path.read_text(encoding='utf-8'):
              raise SystemExit('Address card remains')
          if 'contact.address' in app_path.read_text(encoding='utf-8'):
              raise SystemExit('Address translations remain')
          if 'contact-address-card' in css_path.read_text(encoding='utf-8'):
              raise SystemExit('Address CSS remains')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html app.js site.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove company address from contact page"
            git push origin HEAD:main
          fi
