name: Add Google verification

on:
  push:
    paths:
      - '.github/workflows/add-google-verification.yml'

permissions:
  contents: write

jobs:
  add-google-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add verification meta tag
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          meta = '<meta name="google-site-verification" content="8J0CfdPMO1THo7X6i9tidrklHzjF08pLkyDa5Epgfec" />'
          if meta not in html:
              marker = '<meta name="theme-color" content="#050a12" />'
              if marker not in html:
                  raise SystemExit('Theme meta tag not found')
              html = html.replace(marker, marker + '\n  ' + meta, 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Google site verification meta tag"
            git push origin HEAD:main
          fi
